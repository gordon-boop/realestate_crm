services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    environment:
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/wohnkapital_crm"
      NODE_ENV: "production"
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-before-production-32chars}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-mvp_session_user}
      WK_ENABLE_RUNTIME_STORE: ${WK_ENABLE_RUNTIME_STORE:-false}
      WK_ENABLE_MOCK_STORAGE: ${WK_ENABLE_MOCK_STORAGE:-false}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    ports:
      - "3000:3000"
    expose:
      - "3000"
    depends_on:
      - db

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wohnkapital_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
